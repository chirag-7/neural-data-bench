name: Registry and site integrity
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static site and source render routes
        run: |
          node --check website/app.js
          node --check website/macro-report.js
          node --check website/practical-review.js
          node --check website/generation-patterns.js
          node --check website/generation-lags.js
          node scripts/check_site.mjs
      - name: Validate registry, local Markdown links and measurement provenance
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_macro.py
          python3 scripts/check_practical_review.py
          python3 scripts/check_generation_comparison.py --no-website
          python3 scripts/check_generation_comparison_v2.py
          python3 scripts/check_generation_patterns.py
          python3 scripts/check_generation_lags.py
