name: Registry and site integrity
on: [push, pull_request]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check static site and source render routes
        run: |
          node --check website/app.js
          node --check website/macro-report.js
          node scripts/check_site.mjs
      - name: Validate registry, local Markdown links and measurement provenance
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_macro.py
